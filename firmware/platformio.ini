; PlatformIO Project Configuration File
; Projet BalaSense - Smart Racing Biometric Monitor
; Author: Rhiz
; Date: Janvier 2026

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino



; Configuration série
monitor_speed = 115200
upload_speed = 921600

; Forcer l'inclusion profonde des dépendances
lib_ldf_mode = deep+

; Bibliothèques requises pour les capteurs
lib_deps = 
    ; MAX30102 - Capteur cardiaque BPM + HRV + SpO2
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

    sensirion/Sensirion I2C SCD4x @ ^0.4.0
    
    ; MLX90614 - Capteur température infrarouge
    adafruit/Adafruit MLX90614 Library@^2.1.5
    
    ; ICM-20948 - IMU 9 axes
    sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.2
    
    ; MH-Z19C - Capteur CO2
    wifwaf/MH-Z19@^1.5.4
    
    ; ArduinoJson
    bblanchon/ArduinoJson@^6.21.5

; Options de compilation
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS

; ===== NOTES IMPORTANTES =====
; 
; BOARD: ESP32 (classique, pas ESP32-S2)
;
; CAPTEURS I2C (bus partagé sur SDA/SCL) :
; - MAX30102 : Adresse 0x57
; - MLX90614 : Adresse 0x5A  
; - ICM-20948 : Adresse 0x68
;
; PINS I2C ESP32 classique :
; - SDA : GPIO21
; - SCL : GPIO22
;
; ===== FIN NOTES =====

