; PlatformIO Project Configuration File
; Projet BalaSense - Smart Racing Biometric Monitor
; Author: Rhiz
; Date: Janvier 2026

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial
monitor_speed = 115200
upload_speed = 921600

; Lib dependency mode
lib_ldf_mode = deep+

; Libraries
lib_deps =
  ; ICM-20948 — 9-axis IMU
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library @ ^1.3.2

  ; SCD41 — CO2 + temp + humidity
  sensirion/Sensirion I2C SCD4x @ ^0.4.0
  sensirion/Sensirion Core @ ^0.7.0

  ; TMP117 — skin temperature
  adafruit/Adafruit TMP117
  adafruit/Adafruit BusIO
  adafruit/Adafruit Unified Sensor

  ; ArduinoJson — for MQTT serialization (Phase 2)
  bblanchon/ArduinoJson @ ^6.21.5

build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D CONFIG_ARDUHAL_LOG_COLORS

; ── I2C Bus ──────────────────────────────────────────
; SDA : GPIO21 / SCL : GPIO22
; 0x25 → SDP810-500Pa
; 0x48 → TMP117
; 0x62 → SCD41
; 0x68 → ICM-20948 (AD0 → GND)
;
; ── Analog ───────────────────────────────────────────
; GPIO32 → CJMCU-6701 GSR (OUT)
;
; ── Pending ──────────────────────────────────────────
; MAX30003 (ECG) — SPI — à intégrer Phase 2